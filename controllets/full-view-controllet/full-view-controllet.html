<link rel="import" href="../../bower_components/polymer/polymer.html">
<link rel="import" href="../../bower_components/paper-styles/paper-styles.html">
<link rel="import" href="../../bower_components/neon-animation/neon-animatable-behavior.html">
<link rel="import" type="text/css" href="../../themeFile.html" />

<dom-module id="full-view-controllet">

  <style>


    :host {
      @apply(--layout-vertical);
    }

    .main {
      background: white;
      @apply(--layout-flex);
      @apply(--layout-scroll);
      @apply(--shadow-elevation-8dp);
    }

    .image-container {
      position: relative;
      width: 100%;
      padding-bottom: 100%;
    }

    .image {
      position: absolute;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        45deg,
        #f5f5f5,
        #f5f5f5 8px,
        #e0e0e0 8px,
        #e0e0e0 16px
      );
    }

  </style>

  <template>

    <paper-toolbar id="toEdit" class="medium-tall" style="background: #2196F3;">
      <paper-icon-button id="button" icon="clear" on-click="_onClearButtonClick"></paper-icon-button>
    </paper-toolbar>
	
	<script type="text/javascript">
			    editColor = function () {
							var mainColor = window.getComputedStyle(document.documentElement).getPropertyValue('--mainColor');
							console.log("STAMPA COLORE nel file full-view-controllet html: "+mainColor);
							var styleEdit = "background: "+mainColor+";"
				            document.getElementById("toEdit").setAttribute("style", styleEdit);
				            return;
				            	}();
	</script>

    <div id="main" class="main">
    </div>

  </template>

</dom-module>

<script>

  Polymer({

    is: 'full-view-controllet',

    behaviors: [
      Polymer.NeonAnimatableBehavior
    ],

    properties: {

      sharedElements: {
        type: Object,
        value: function() {
          return {
            'hero': this.$.main
          };
        }
      },

      animationConfig: {
        type: Object,
        value: function() {
          return {
            'entry': [{
              name: 'fade-in-animation',
              node: this.$.button
            }, {
              name: 'hero-animation',
              id: 'hero',
              toPage: this
            }],

            'exit': [{
              name: 'fade-out-animation',
              node: this.$.button
            }, {
              name: 'scale-down-animation',
              node: this.$.main,
              transformOrigin: '50% 50%',
              axis: 'y'
            }]

          }
        }
      }
    },

    _onClearButtonClick: function() {
      this.fire('close');
    }

  });

</script>
